<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">learn-wiki</title>
  <desc id="desc">You design. Claude codes. Your wiki remembers what you actually know.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>

  <!-- Left: name and tagline -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="140" font-size="76" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">learn<tspan fill="#a5b4fc">-</tspan>wiki</text>
    <text x="74" y="190" font-size="25" fill="#cbd5e1">You design. Claude codes.</text>
    <text x="74" y="224" font-size="25" fill="#cbd5e1">Your wiki remembers what you <tspan fill="#f8fafc" font-weight="600">actually</tspan> know.</text>
    <g font-size="15" fill="#94a3b8" letter-spacing="0.5">
      <text x="74" y="268">EVIDENCE OVER CLAIMS  ·  LEARNER-OWNED DESIGN  ·  ONE WIKI, EVERY PROJECT</text>
    </g>
  </g>

  <!-- Right: knowledge map -->
  <g stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="880" y1="92"  x2="1010" y2="150"/>
    <line x1="1010" y1="150" x2="1150" y2="96"/>
    <line x1="1010" y1="150" x2="985"  y2="252"/>
    <line x1="880" y1="92"  x2="842"  y2="210"/>
    <line x1="842" y1="210" x2="985"  y2="252"/>
    <line x1="1150" y1="96" x2="1170" y2="224"/>
    <line x1="985" y1="252" x2="1170" y2="224"/>
  </g>

  <!-- solid -->
  <circle cx="1010" cy="150" r="17" fill="#34d399"/>
  <circle cx="880"  cy="92"  r="13" fill="#34d399"/>
  <!-- shaky -->
  <circle cx="1150" cy="96"  r="13" fill="#fbbf24"/>
  <circle cx="985"  cy="252" r="12" fill="#fbbf24"/>
  <!-- exposed -->
  <circle cx="842"  cy="210" r="11" fill="#0b1220" stroke="#60a5fa" stroke-width="3"/>
  <!-- not yet known -->
  <circle cx="1170" cy="224" r="9" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">
    <text x="1034" y="155">tcp handshake</text>
    <text x="826"  y="80">dns resolution</text>
    <text x="1112" y="74">subnetting</text>
    <text x="1004" y="282">routing</text>
    <text x="802"  y="242">nat</text>
    <text x="1132" y="256" fill="#94a3b8">tls…</text>
  </g>

  <!-- Legend -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">
    <circle cx="784" cy="296" r="5" fill="#34d399"/><text x="794" y="300">solid</text>
    <circle cx="848" cy="296" r="5" fill="#fbbf24"/><text x="858" y="300">shaky</text>
    <circle cx="914" cy="296" r="4" fill="none" stroke="#60a5fa" stroke-width="2"/><text x="924" y="300">exposed</text>
    <circle cx="994" cy="296" r="4" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 2"/><text x="1004" y="300">not yet</text>
  </g>
</svg>
